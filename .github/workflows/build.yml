name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout bhoptimer includes
        uses: actions/checkout@v4
        with:
          repository: shavitush/bhoptimer
          path: bhoptimer

      - name: Set up SourcePawn compiler
        uses: rumblefrog/setup-sp@master
        with:
          version: "1.12.x"

      - name: Compile
        run: |
          mkdir -p build
          for src in scripting/bhop-get-stats.sp scripting/jumpstats.sp; do
            spcomp -i bhoptimer/addons/sourcemod/scripting/include -i scripting/include -o build/$(basename $src .sp).smx $src
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bhop-get-stats
          path: build/*.smx
